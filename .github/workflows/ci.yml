name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo-checks:
    name: Phase 0 — URL migration integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Reconstruit inventaire + carte et vérifie la non-régression des URLs.
      - run: npm run seo:inventory
      - run: npm run seo:map
      - run: npm run seo:routes
      - run: npm run test:seo

  # NB : lint / type-check / build / tests applicatifs seront ajoutés en Phase 3
  # une fois le monorepo Next.js + Payload en place.
