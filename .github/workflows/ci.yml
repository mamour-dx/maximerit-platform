name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo-checks:
    name: SEO — URL migration & routes integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run seo:inventory
      - run: npm run seo:map
      - run: npm run seo:routes
      - run: npm run test:seo

  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      - run: pnpm --filter web test --run
      - run: pnpm --filter web build

  integration:
    name: Integration — Payload + PostgreSQL (DB + RBAC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maximerit
          POSTGRES_PASSWORD: maximerit_dev
          POSTGRES_DB: maximerit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maximerit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://maximerit:maximerit_dev@localhost:5432/maximerit
      PAYLOAD_SECRET: ci_secret_change_me
      PAYLOAD_CONFIG_PATH: src/payload.config.ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec payload migrate --use-swc
      - run: pnpm --filter web test:int
