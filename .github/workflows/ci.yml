name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo-checks:
    name: SEO — URL migration & routes integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run seo:inventory
      - run: npm run seo:map
      - run: npm run seo:routes
      - run: npm run seo:redirects
      - run: npm run test:seo

  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      - run: pnpm --filter web test --run
      - run: pnpm --filter web build

  integration:
    name: Integration — Payload + PostgreSQL + Meilisearch (DB, RBAC, recherche)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maximerit
          POSTGRES_PASSWORD: maximerit_dev
          POSTGRES_DB: maximerit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maximerit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: masterKey_dev_change_me
          MEILI_ENV: development
        ports: ["7700:7700"]
    env:
      DATABASE_URI: postgres://maximerit:maximerit_dev@localhost:5432/maximerit
      PAYLOAD_SECRET: ci_secret_change_me
      PAYLOAD_CONFIG_PATH: src/payload.config.ts
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: masterKey_dev_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Attendre Meilisearch
        run: for i in $(seq 1 30); do curl -sf http://localhost:7700/health && break || sleep 2; done
      - run: pnpm --filter web exec payload migrate --use-swc
      - run: pnpm --filter web test:int
